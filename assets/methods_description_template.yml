data: |
  <h4>Methods</h4>
  <p>Data was processed using integrativebioinformatics/pulposeq v${workflow.manifest.version} ${doi_text}, a Nextflow-based pipeline designed for isoform-level lncRNA discovery and characterization from long-read RNA-seq data. The pipeline execution leveraged Nextflow v${workflow.nextflow.version} (<a href="https://doi.org/10.1038/nbt.3820">Di Tommaso <em>et al.</em>, 2017</a>) combined with containerized software environments to ensure reproducibility and consistency across systems.</p>
  
  <p>Reproducible environments for software packages were achieved through containerization and virtual environment technologies including Docker (<a href="https://doi.org/10.5555/2600239.2600241">Merkel, 2014</a>), Singularity/Apptainer (<a href="https://doi.org/10.1371/journal.pone.0177459">Kurtzer <em>et al.</em>, 2017</a>), Wave (<a href="https://seqera.io/wave/">Seqera Wave Containers</a>), Bioconda (<a href="https://doi.org/10.1038/s41592-018-0046-7">Grüning <em>et al.</em>, 2018</a>), BioContainers (<a href="https://doi.org/10.1093/bioinformatics/btx192">da Veiga Leprevost <em>et al.</em>, 2017</a>). References for all specific software tools used can be found in the [CITATIONS.md](https://github.com/integrativebioinformatics/pulposeq/blob/main/CITATIONS.md) file.</p>
  
  <p>The pipeline was executed with the following command:</p>
  <pre><code>${workflow.commandLine}</code></pre>
  <p>${tool_citations}</p>
  <h4>References</h4>
  <ul>
    <li>Di Tommaso, P., Chatzou, M., Floden, E. W., Barja, P. P., Palumbo, E., & Notredame, C. (2017). Nextflow enables reproducible computational workflows. Nature Biotechnology, 35(4), 316-319. doi: <a href="https://doi.org/10.1038/nbt.3820">10.1038/nbt.3820</a></li>
    <li>Ewels, P. A., Peltzer, A., Fillinger, S., Patel, H., Alneberg, J., Wilm, A., Garcia, M. U., Di Tommaso, P., & Nahnsen, S. (2020). The nf-core framework for community-curated bioinformatics pipelines. Nature Biotechnology, 38(3), 276-278. doi: <a href="https://doi.org/10.1038/s41587-020-0439-x">10.1038/s41587-020-0439-x</a></li>
    <li>Merkel, D. (2014). Docker: lightweight linux containers for consistent development and deployment. Linux Journal, 2014(239), 2. doi: <a href="https://doi.org/10.5555/2600239.2600241">10.5555/2600239.2600241</a></li>
    <li>Kurtzer, G. M., Sochat, V., & Bauer, M. W. (2017). Singularity: Scientific containers for mobility of compute. PLoS ONE, 12(5), e0177459. doi: <a href="https://doi.org/10.1371/journal.pone.0177459">10.1371/journal.pone.0177459</a></li>
    <li>Grüning, B., Dale, R., Sjödin, A., Chapman, B. A., Rowe, J., Tomkins-Tinch, C. H., Valieris, R., Köster, J., & Bioconda Team. (2018). Bioconda: sustainable and comprehensive software distribution for the life sciences. Nature Methods, 15(7), 475–476. doi: <a href="https://doi.org/10.1038/s41592-018-0046-7">10.1038/s41592-018-0046-7</a></li>
    <li>da Veiga Leprevost, F., Grüning, B. A., Alves Aflitos, S., Röst, H. L., Uszkoreit, J., Barsnes, H., Vaudel, M., Moreno, P., Gatto, L., Weber, J., Bai, M., Jimenez, R. C., Sachsenberg, T., Pfeuffer, J., Vera Alvarez, R., Griss, J., Nesvizhskii, A. I., & Perez-Riverol, Y. (2017). BioContainers: an open-source and community-driven framework for software standardization. Bioinformatics (Oxford, England), 33(16), 2580–2582. doi: <a href="https://doi.org/10.1093/bioinformatics/btx192">10.1093/bioinformatics/btx192</a></li>
    ${tool_bibliography}
  </ul>
