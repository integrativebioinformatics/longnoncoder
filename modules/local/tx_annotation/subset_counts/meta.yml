name: "subset_bambu_counts"
description: Filter zero-count rows from Bambu gene and transcript count matrices, retaining only features with at least one non-zero sample value.
keywords:
  - counts
  - filtering
  - bambu
  - zero-count
  - quantification
tools:
  - awk:
      description: Pattern scanning and processing language.
      homepage: https://www.gnu.org/software/gawk/
      licence: ["GPL-3.0-or-later"]
  - bash:
      description: GNU Bourne-Again SHell.
      homepage: https://www.gnu.org/software/bash/
      licence: ["GPL-3.0-or-later"]

input:
  - counts_gene:
      type: file
      description: Gene-level read counts from Bambu.
      pattern: "*.txt"
  - counts_transcript:
      type: file
      description: Transcript-level read counts from Bambu.
      pattern: "*.txt"
  - cpm_transcript:
      type: file
      description: Transcript-level CPM values from Bambu.
      pattern: "*.txt"
  - full_length_counts_transcript:
      type: file
      description: Full-length transcript counts from Bambu.
      pattern: "*.txt"
  - unique_counts_transcript:
      type: file
      description: Unique read counts per transcript from Bambu.
      pattern: "*.txt"

output:
  - counts_gene_filtered:
      type: file
      description: Gene-level counts with zero-count rows removed.
      pattern: "BambuOutput_counts_gene_filtered.txt"
  - counts_transcript_filtered:
      type: file
      description: Transcript-level counts with zero-count rows removed.
      pattern: "BambuOutput_counts_transcript_filtered.txt"
  - cpm_transcript_filtered:
      type: file
      description: Transcript-level CPM with zero-count rows removed.
      pattern: "BambuOutput_CPM_transcript_filtered.txt"
  - full_length_counts_transcript_filtered:
      type: file
      description: Full-length transcript counts with zero-count rows removed.
      pattern: "BambuOutput_fullLengthCounts_transcript_filtered.txt"
  - unique_counts_transcript_filtered:
      type: file
      description: Unique transcript counts with zero-count rows removed.
      pattern: "BambuOutput_uniqueCounts_transcript_filtered.txt"
  - versions:
      type: file
      description: File containing software versions.
      pattern: "versions.yml"

authors:
  - "@borgessbarbara"
  - "@gleisonm"
  - "@lfreitasl"
maintainers:
  - "@borgessbarbara"
  - "@gleisonm"
  - "@lfreitasl"