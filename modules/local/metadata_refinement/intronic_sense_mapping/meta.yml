name: intronic_sense_mapping
description: |
  Structural evidence for intronic sense transcripts, read from the alignments they were
  assembled from.

  Answers two questions that need no organism-specific threshold:

    A  Is the novel transcript on the same strand as the gene whose intron it
       lies in? On the opposite strand, the host's pre-mRNA cannot explain it.

    D  Do the supporting reads stop at the transcript's boundaries, and do they
       carry the host gene's splice junctions? Reads running past the boundaries,
       or carrying junctions the candidate does not have, came from a longer
       molecule.

  Every output is a count or a flag, reported per transcript. Nothing is filtered
  and no score is collapsed: the cases worth inspecting are the ones where the
  signals disagree.
keywords:
  - lncRNA
  - novel transcripts
  - intronic sense
  - pre-mRNA
  - internal priming
  - validation
tools:
  - R:
      description: Rsamtools / GenomicAlignments read the alignments; rtracklayer reads the annotation.
      homepage: https://www.r-project.org/
      licence: ["GPL-2.0-or-later"]

input:
  - metadata:
      type: file
      description: Novel transcript metadata CSV, carrying seqnames, start, end, strand, class_code and ref_gene_id
      pattern: "*.csv"
  - annotation:
      type: file
      description: Reference annotation GTF (Ensembl or GENCODE), used for host gene extent, exons and introns
      pattern: "*.{gtf,gtf.gz}"
  - bams:
      type: file
      description: Coordinate-sorted alignments, one per sample
      pattern: "*.bam"
  - bais:
      type: file
      description: Index for each BAM, staged alongside it so random access works
      pattern: "*.bai"
  - r_script:
      type: file
      description: bin/intronic_sense_mapping.R
      pattern: "*.R"

output:
  - flags:
      type: file
      description: |
        One row per intronic sense transcript: host gene and its biotype and strand,
        same_strand_as_host, and the read counts behind test D.
      pattern: "intronic_sense_flags.csv"
  - summary:
      type: file
      description: Aggregate counts for the report
      pattern: "intronic_sense_summary.csv"
  - versions:
      type: file
      description: Software versions
      pattern: "versions.yml"

args:
  - --junction_tolerance:
      description: |
        Slack when matching a read's junction to a host intron, in bases. Default
        10, which is the window within which minimap2's splice-site placement is
        conventionally assessed, so it characterises the aligner's own precision
        rather than a preference about what counts as a match.

        This is the only tolerance the module takes. Boundary read-through is
        reported as a distance per transcript rather than as a count of reads past
        a cutoff, so no margin has to be chosen.

authors:
  - "@borgessbarbara"
